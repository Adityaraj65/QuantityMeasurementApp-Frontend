<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuantifyPro | Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h2 id="authTitle">Welcome Back</h2>
            <p id="authSubtitle">Login to access your history</p>
        </div>

        <div class="auth-form">
            <input type="email" id="email" placeholder="Email Address" class="form-input">
            <input type="password" id="pass" placeholder="Password" class="form-input">
            
            <button id="submitAuth" class="btn-primary">Login</button>
            
            <p class="toggle-text">
                <span id="toggleLabel">Don't have an account?</span>
                <button id="toggleBtn" class="link-btn">Sign Up</button>
            </p>
            <a href="index.html" class="back-link">← Back to Dashboard</a>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
